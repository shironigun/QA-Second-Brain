services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qasecondbrain
      POSTGRES_USER: qasb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qasb_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qasb -d qasecondbrain"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
