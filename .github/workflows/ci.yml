name: CI

on:
  push:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/backend/QaSecondBrain.sln -c Release
      - name: Test (Testcontainers uses the runner's Docker)
        run: dotnet test src/backend/QaSecondBrain.sln

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm --prefix src/web ci
      - run: npm --prefix src/web run build
      - run: npm --prefix src/web run test -- --run
      - run: npm --prefix src/web run lint
